name: Update NEM data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nem-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the data store from the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
            rm -rf data/.git
          else
            mkdir -p data
          fi

      - name: Update from AEMO
        env:
          RR_CONTACT: ${{ vars.RR_CONTACT }}
        run: python -m rr_nem update --data-dir data

      - name: Publish the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init --quiet -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Update NEM data"
          git push --quiet --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
