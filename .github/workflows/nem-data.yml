name: Update NEM data

on:
  # The main trigger is an outside scheduler (a cPanel cron job on the website hosting) that
  # calls this workflow's workflow_dispatch at 7 and 22 minutes past each hour. GitHub's own
  # schedule is best effort and in practice drops most hourly runs, so it is kept only as a
  # backup. Repeat runs are harmless: only new AEMO files are downloaded.
  schedule:
    - cron: "12 * * * *"
    - cron: "42 * * * *"
  workflow_dispatch:   # run by hand from the Actions tab, or by the outside scheduler

permissions:
  contents: write

concurrency:
  group: nem-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the data store from the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
            rm -rf data/.git
          else
            mkdir -p data
          fi

      - name: Update from AEMO
        env:
          RR_CONTACT: ${{ vars.RR_CONTACT }}
        run: python -m rr_nem update --data-dir data

      - name: Refresh the STC price (at most weekly)
        continue-on-error: true   # the rebate calculator falls back to its built-in price
        run: python -m rr_nem stc --data-dir data

      - name: Move raw days older than 400 days to the archive branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m rr_nem prune --data-dir data --keep-days 400 --archive-dir archive-out
          if [ -d archive-out ] && [ -n "$(ls -A archive-out)" ]; then
            url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git ls-remote --exit-code --heads origin archive >/dev/null 2>&1; then
              git clone --quiet --depth 1 --branch archive "$url" archive
            else
              mkdir archive && git -C archive init --quiet -b archive
            fi
            cp -r archive-out/. archive/
            cd archive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --quiet -m "Archive raw NEM data"
            git push --quiet "$url" archive
          fi

      - name: Publish the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init --quiet -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Update NEM data"
          git push --quiet --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
