name: Backfill history

# Run by hand from the Actions tab. Loads AEMO's archived 5-minute prices, demand and rooftop
# solar for the months given, rebuilds the daily statistics and half-hour profile, and
# publishes the data branch. It shares the hourly job's lock, so the two never overlap.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "First month (YYYY-MM)"
        required: true
        default: "2026-01"
      to:
        description: "Last month (YYYY-MM)"
        required: true
        default: "2026-10"

permissions:
  contents: write

concurrency:
  group: nem-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the data store from the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
            rm -rf data/.git
          else
            mkdir -p data
          fi

      - name: Load history from the AEMO archive
        env:
          RR_CONTACT: ${{ vars.RR_CONTACT }}
        run: |
          python -m rr_nem backfill --data-dir data --from "${{ inputs.from }}" --to "${{ inputs.to }}"
          python -m rr_nem update --data-dir data

      - name: Publish the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init --quiet -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Backfill NEM history ${{ inputs.from }} to ${{ inputs.to }}"
          git push --quiet --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
